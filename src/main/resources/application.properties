spring.application.name=covoiturage

# --- Base de donnees (PostgreSQL portable ou Docker Compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/covoiturage
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# --- Donnees de demonstration ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Logs (INFO actions metier, WARN regles refusees) ---
logging.level.ma.brief.covoiturage=INFO
logging.level.org.hibernate.SQL=WARN

# --- Actuator (verification rapide que l'API est up) ---
management.endpoints.web.exposure.include=health,info
